.rln{font-size:64px;line-height:1.05;font-weight:900}
.rld{font-size:16px;margin-top:4px}
.rlg .rln{color:#8dffb8;text-shadow:0 0 22px #3fe08a}
.rlbd .rln{color:#ff8a8a;text-shadow:0 0 22px #ff3b3b}
.rlbd .rlw{animation:rlsh .5s}
@keyframes rlsh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rlfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rlfx span{position:absolute;top:-50px;animation:rlf 2.6s ease-in forwards}
@keyframes rlf{to{transform:translateY(112vh) rotate(360deg)}}

/* cartel */
.cart{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:14px;background:#000b;animation:rlin .3s ease-out}
.cbox{width:100%;max-width:380px;max-height:86vh;overflow:auto;background:var(--bg);color:var(--tx);border:3px solid var(--ln);border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 10px 40px #000a}
.cbox .cic{font-size:54px;line-height:1}.cbox h2{margin:6px 0 8px}.cbox .ctx{font-size:15px;line-height:1.45;text-align:left;margin-bottom:14px}
.cbox .alb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.cbox .alb div{background:var(--pn);border-radius:12px;padding:6px 2px;font-size:11px}.cbox .alb b{display:block;font-size:26px}
.acts .btn.r{background:#e0453a;color:#fff;border-color:#4d3a4c}
/* menú ordenado + cartelitos */
.subt{font-size:14px;opacity:.85}
.sign{display:inline-block;align-self:flex-start;font-weight:800;font-size:13px;letter-spacing:.3px;background:#e6bb6a;color:#4d3a4c;border:2px solid #4d3a4c;border-radius:10px;padding:3px 12px;box-shadow:0 2px 0 #4d3a4c;transform:rotate(-1.2deg);margin-top:4px}
.go{display:flex;flex-direction:column;gap:10px}
.gc{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:18px;border:3px solid var(--ln);background:var(--ac);color:#fff;font:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ln)}
.gc.y{background:#e6bb6a;color:#4d3a4c}.gc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ln)}
.gc b{display:block;font-size:17px}.gc small{display:block;font-size:12px;opacity:.92;font-weight:600;margin-top:1px}.ic{font-size:32px;line-height:1;flex:none}
.gc2,.lobby{border:3px solid var(--ln);border-radius:18px;background:var(--pn);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--ln)}
.gh{display:flex;gap:12px;align-items:center}.gh b{display:block;font-size:17px}.gh small{display:block;font-size:12px;opacity:.8;font-weight:600}
.or{text-align:center;font-size:12px;font-weight:700;opacity:.7}.lobby .btn{margin-top:6px}
.sec{padding:0;overflow:hidden;border:2px solid var(--ln);border-radius:16px}
.sec>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.sec>summary::-webkit-details-marker{display:none}.sec>summary::after{content:'Abrir ▸';margin-left:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:2px solid var(--ln);background:var(--pn);white-space:nowrap}.sec[open]>summary::after{content:'Cerrar ▾';background:#fff}
.sec>summary small{display:block;font-size:11px;font-weight:600;opacity:.7}.sic{font-size:24px}
.sec .bd{padding:2px 12px 12px;display:flex;flex-direction:column;gap:12px}
.fl>b{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:13px;margin-bottom:5px}
.tag{font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;border:1.5px solid var(--ln);color:#4d3a4c}.tag.c{background:#eaa9bd}.tag.s{background:#8fc5bd}.tag.m{background:#f0cf8a}
/* efectos de momentos clave */
.bl{position:fixed;z-index:75;pointer-events:none;font-size:46px;line-height:1;transform:translate(-50%,-50%);animation:blm 1.25s ease-out forwards}
.bl.t{font-size:20px;font-weight:900;color:#4d3a4c;background:#fff;border:2px solid #4d3a4c;border-radius:12px;padding:3px 9px;white-space:nowrap}
@keyframes blm{0%{transform:translate(-50%,-50%) scale(.2) rotate(-25deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.5) rotate(10deg);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
@media (prefers-reduced-motion:no-preference){
.cbox{animation:cbin .5s cubic-bezier(.2,1.5,.4,1)}@keyframes cbin{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.cbox .cic{display:inline-block;animation:cic 1.2s ease-in-out .3s 2}@keyframes cic{40%{transform:scale(1.35) rotate(-10deg)}70%{transform:scale(.95) rotate(6deg)}}
.cart[data-k=rev] .cic{animation:cirev 1.5s linear .2s 2}@keyframes cirev{to{transform:rotate(-360deg)}}
.cart[data-k=fast] .cbox{animation:cbin .5s cubic-bezier(.2,1.5,.4,1),cbp .5s ease-in-out .5s infinite alternate}@keyframes cbp{to{box-shadow:0 0 0 6px #e0453a66,0 10px 40px #000a}}
.cart[data-k=duel] .cbox{animation:cbin .5s cubic-bezier(.2,1.5,.4,1),rlsh .5s .5s}
.cart[data-k=her] .cic{animation:crw 1s cubic-bezier(.3,1.6,.5,1) both}@keyframes crw{from{transform:translateY(-140px) rotate(-30deg);opacity:0}}
.cart[data-k=alb] .cic{animation:cfl 1s ease-out both}@keyframes cfl{from{transform:rotateY(540deg) scale(.4);opacity:0}}
.curio.open{animation:cop .7s cubic-bezier(.2,1.5,.4,1)}@keyframes cop{from{transform:scale(.7) rotate(-3deg);opacity:.2}}
.curio.open img{animation:cim 1s ease-out .2s both}@keyframes cim{from{transform:translateY(20px) scale(.4);opacity:0}}}
/* mesa social + revancha */
.dish[data-k]{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}.dish[data-k]:active{scale:1.12}
.brz{border:2px solid var(--ln);background:#e6bb6a;color:#4d3a4c;border-radius:999px;font-weight:800;font-size:12px;padding:1px 9px;cursor:pointer;margin-left:4px}
.inv{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);z-index:71;display:flex;gap:8px;align-items:center;background:#fff;color:#4d3a4c;border:3px solid var(--ac);border-radius:999px;padding:6px 8px 6px 14px;font-weight:700;font-size:13px;box-shadow:0 6px 18px #0005;white-space:nowrap;animation:invin .4s cubic-bezier(.2,1.5,.4,1)}
.inv button{border:0;background:var(--ac);color:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
@keyframes invin{from{transform:translateX(-50%) translateY(40px);opacity:0}}
.rvl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.rvp{display:inline-flex;align-items:center;gap:4px;background:var(--pn);border:2px solid var(--ln);border-radius:999px;padding:2px 9px 2px 4px;font-size:12px;font-weight:700}.rvp img{height:22px;width:auto;max-width:26px;object-fit:contain}.rvp svg{width:22px;height:22px}
/* fotos y ambiente real */
.av img.sp-ph{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:50%}
.chip img.sp-ph{height:28px;width:28px;max-width:none;object-fit:cover;border-radius:50%;vertical-align:middle}
.rvp img.sp-ph{height:22px;width:22px;max-width:none;object-fit:cover;border-radius:50%}
.ppb{height:72px;margin:-10px -10px 6px;background:var(--ppb) center/cover;border-bottom:3px solid var(--ln);border-radius:0 0 18px 18px}
body.mn::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--pat) center/cover;opacity:.17;pointer-events:none}
.table{background:var(--tela) center/cover}.table::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--pn);opacity:.55;pointer-events:none}.table>div{position:relative}
.tb td.dead,.tb th.dead{opacity:.45;text-decoration:line-through}.tb tfoot td.dead{opacity:.45;text-decoration:line-through}</style></head><body><div id="app"></div>

const OPP=[
{n:'Angélica Narváez',a:'img:ph_angelica',t:'Fácil',l:0,f:{s:'Querida, aquí la señora soy yo|Siéntate, que voy a darte una lección',t:'Esa carta me corresponde, ¡yo soy la esposa!|Gracias, me la merezco',c:'Corto. ¡Qué fácil! 🎺|Se acabó, mosquita muerta',h:'¡Chinchón! Eso te pasa por entrometida|¡Chinchón, querida!',w:'Gané, como toda dama de sociedad|Tú no eres nadie en esta mesa',p:'¡Es un escándalo, me niego a perder!|Esto no se va a quedar así',g:'Qué suerte tan corriente la tuya|Suerte de arrimada',b:'¡Ja! Se te acabó la suerte, huerfanita|Qué pena me das',q:'Hasta la suerte me debe respeto',z:'¡Esto es culpa de la criada!'}},
{n:'Teresa',a:'img:ph_teresa',t:'Fácil',l:0,f:{s:'Nací pobre, pero juego como reina|Hoy empiezo a subir: ¡a ganar!|De aquí salgo con todo',t:'Lo que otros tiran, yo lo aprovecho|Esa carta me sirve para subir',c:'Corto. ¡Un escalón más! 🎺|¡Qué rico se siente ganar!',h:'¡Chinchón! ¡Ya llegué a la cima!|¡Chinchón! Nadie me para',w:'Salí de abajo… ¡y gané!|Mi ambición no tiene límite',p:'Me caí… pero volveré a subir|Esta humillación no la olvido',g:'La suerte es de quien la busca|¿Suerte? Yo la trabajo',b:'La vida es dura, querida|Así es el ascenso: ¡a ti te toca bajar!',q:'Yo sabía que subiría',z:'Un tropiezo más en el camino'}},
{n:'Doña Bárbara',a:'img:ph_barbara',t:'Medio',l:1,f:{s:'En mi llano mando yo|Aquí no se mueve carta sin mí|Siéntese, que la doña va a jugar',t:'Lo que cae en mi llano es mío|Esa me la quedo, ¡por las buenas!',c:'Corto. Así lo dispone la doña 🎺|¡Se acabó el pleito!',h:'¡Chinchón! La doña manda|¡Chinchón! El llano es mío',w:'Gané. El llano sigue siendo mío|La doña nunca pierde',p:'Esto lo arreglo a mi manera|Perdí… ¡pero el llano es mío!',g:'Suerte de forastero, nada más|Hasta la suerte te cuida, ¡qué cosa!',b:'El llano no perdona|Se te acabó la suerte, forastero',q:'La suerte obedece a la doña',z:'¡Me hicieron brujería!'}},
{n:'Doña Bernarda',a:'img:ph_bernarda',t:'Medio',l:1,f:{s:'Rece, hijo, que le va a hacer falta|Aquí se juega con decoro y a mi manera',t:'Esa carta me pertenece, por derecho|Dios me la manda, ¡gracias!',c:'Corto. Así lo manda el Señor 🎺|Se acabó la discusión',h:'¡Chinchón! Que Dios la bendiga… a mí|¡Chinchón, por la gracia divina!',w:'La familia Iturbide siempre gana|Gané con la bendición del cielo',p:'Esto es un pecado y alguien lo pagará|Dios sabrá castigar esta afrenta',g:'Suerte de herejes, nada más|Ya lo dirá el Señor',b:'Dios aprieta pero no ahorca… a mí|Que el cielo se apiade de ti',q:'Hasta la suerte me reza',z:'¡Esto es obra del demonio!'}},
{n:'Aarón Montalvo',a:'img:ph_aurelio',t:'Medio',l:1,f:{s:'En mi hacienda se juega a mi ley|Aquí mando yo, ¿entendido?|Siéntese, que va a perder',t:'Esa carta es de mi propiedad|Lo que levanta el patrón es ley',c:'Cierro. Aquí mando yo 🎺|Se acabó, así lo digo yo',h:'¡Chinchón! ¡Soy el amo!|¡Chinchón a mi manera!',w:'Te dije que aquí mando yo|La hacienda es mía, ¡y la baraja!',p:'¡Esto lo arreglo con mis peones!|Perdí… ¡pero sigo siendo el patrón!',g:'Suerte de peón, nada más',b:'¡Así se paga el atrevimiento!',q:'Hasta la suerte me obedece',z:'¡Quién osó maldecirme!'}},
{n:'Soraya Montenegro',a:'img:ph_soraya',t:'Difícil',l:2,f:{s:'Soy una Montenegro. Yo no pierdo|Siéntate, plebeya, voy a ganarte|El dinero siempre gana',t:'Gracias, plebeya, me sirve|Esa carta vale más en mi mano',c:'Corto. Tus puntos son míos 🎺|Ya basta, ¡me aburro!',h:'¡CHINCHÓN! Ruega, plebeya|Soy una Montenegro: ¡chinchón!',w:'Gané, como siempre|Los Montenegro siempre ganan',p:'¡Esto insulta a mi apellido!|¡Perdí por culpa de la servidumbre!',g:'Suerte de pobre, nada más|Qué suerte… ¡insolente!',b:'Jajaja, ¡qué patético!|Dinero y suerte: yo sí tengo',q:'Hasta el destino es mi sirviente',z:'¡Que despidan a la rueda!'}},

/* secretos y curiosidades de México: uno se revela al terminar cada partida */
const CUR=[
['av_ajolote1','El ajolote, tesoro de Xochimilco','Solo vive de forma natural en los canales de Xochimilco, en la Ciudad de México, y puede regenerar patas, cola e incluso partes de sus órganos. Hoy está en peligro crítico de extinción.'],
['av_cempasuchil','La flor de cempasúchil','Su nombre viene del náhuatl y alude a «muchas flores». En el Día de Muertos su color y su aroma sirven para marcar el camino de las almas hacia los altares.'],
['av_calendario','La Piedra del Sol','Pesa unas 24 toneladas y se halló en 1790 bajo el Zócalo de la Ciudad de México. Aunque se le dice «calendario azteca», muchos expertos creen que fue sobre todo un monumento ceremonial.'],
['av_piramide','La pirámide más grande del mundo','La Gran Pirámide de Cholula, en Puebla, es la más grande del mundo por volumen. Hoy parece un cerro con una iglesia en la cima, porque con los siglos quedó cubierta de tierra y vegetación.'],
['av_olmeca','Las cabezas colosales olmecas','Se conocen 17, talladas en basalto hace más de 2,500 años. A los olmecas se los llama la «cultura madre» de Mesoamérica, aunque los historiadores todavía debaten ese título.'],
['av_quetzal','El quetzal y la serpiente emplumada','Para los mexicas las plumas verdes del quetzal eran un tesoro de enorme valor, reservado a la nobleza y a los sacerdotes. Están ligadas a Quetzalcóatl, la serpiente emplumada.'],
['av_pinata','La piñata y sus siete picos','Según la tradición, los siete picos representan los siete pecados capitales, y por eso se rompe con los ojos vendados. Se asocia con las posadas navideñas y a veces se rastrea hasta frailes agustinos del siglo XVI.'],
['av_aguila','El águila y el nopal','Según la leyenda, los mexicas fundaron Tenochtitlan donde vieron un águila sobre un nopal devorando una serpiente. Esa imagen sigue en el escudo y en la bandera de México.'],
['av_mariposa','La mariposa monarca','Viaja unos 4,000 km desde Canadá y Estados Unidos hasta los bosques de oyamel de Michoacán y el Estado de México. Llega por los días del Día de Muertos, y muchos creen que trae las almas de los difuntos.'],
['av_colibri','El colibrí guerrero','El nombre de Huitzilopochtli, dios mexica de la guerra, suele traducirse como «colibrí zurdo» o «del sur». Se creía que los guerreros caídos volvían convertidos en colibríes.'],
['fig_mariachi','El mariachi','Desde 2011 es Patrimonio Cultural Inmaterial de la Humanidad según la UNESCO. Nació en el occidente de México, sobre todo en Jalisco.'],
['fig_catrina','La Catrina','La creó el grabador José Guadalupe Posada hacia 1910 como «La Calavera Garbancera», una burla a quienes presumían lo que no eran. Diego Rivera la vistió y la hizo famosa en un mural de 1947.'],
['fig_tequila','El tequila','Solo puede hacerse con agave azul y dentro de una zona con denominación de origen, sobre todo en Jalisco. El paisaje agavero de Tequila es Patrimonio de la Humanidad desde 2006.'],
['d_elote','El maíz, origen de todo','Se domesticó en México hace unos 9,000 años a partir de una hierba silvestre llamada teocintle. En el Popol Vuh maya, los primeros humanos están hechos de maíz.'],
['d_nogada','Chiles en nogada','Según la leyenda nacieron en Puebla en 1821, y sus colores (verde, blanco y rojo) recuerdan a la bandera. Se sirven sobre todo entre agosto y septiembre.'],
['fig_taco','El taco al pastor','Desciende del shawarma, que llegó a México con inmigrantes libaneses a principios del siglo XX. Aquí cambiaron el cordero por cerdo y le sumaron tortilla y piña.'],
['av_cactus','México, país de cactus','Aquí vive alrededor de la mitad de las especies de cactus del mundo. Los cactus y los nopales forman parte de la comida, la medicina y el paisaje desde hace miles de años.'],
['lot_gallo','La Lotería mexicana','La versión moderna la popularizó Don Clemente Jacques en 1887, con 54 cartas. Cada tabla tiene 16 imágenes, y quien las completa grita «¡Lotería!».'],
['av_muneca','La muñeca otomí','Es una muñeca de trapo hecha a mano por artesanas otomíes de Amealco, Querétaro, con vestidos bordados de colores. Cada una es única.'],
['av_bailarina','El jarabe tapatío','Nació en Jalisco y desde 1924 se le considera el baile nacional de México. Es famoso por su zapateado y sus giros de falda.'],
['fig_charro','La charrería','Es Patrimonio Cultural Inmaterial de la Humanidad según la UNESCO desde 2016. En México se la considera el deporte nacional desde 1933.'],
['d_champ','El cacao, moneda y bebida','Los mexicas usaban granos de cacao como moneda y bebían xocólatl, un chocolate amargo y espumoso, a veces con chile. De ahí viene la palabra «chocolate».'],
['av_nopalcorazon','El nopal y la grana cochinilla','Se come desde tiempos prehispánicos y en sus pencas vive la cochinilla, el insecto del que sale el rojo carmín que México exportó al mundo.']

function albShow(){const got=P.alb||[];CQ.push({ic:'📖',ti:'Álbum de lotería ('+got.length+'/'+ALB.length+')',tx:'Ganá partidas para completar el álbum. Cada carta se puede usar como avatar.<br><br><div class=alb>'+ALB.map((c,i)=>got.includes(i)?'<div><b>'+c[1]+'</b>'+c[0]+'</div>':'<div><b>🔒</b>?</div>').join('')+'</div>'});cqRun()}
/* ===== mesa social: comer, tomar, brindar (sincronizado en salas con el evento 'fx') ===== */
const DRK=['d_cantaritos','d_jamaica','d_champ'],HOT=['d_taco','d_tacos','d_pozole','d_guac','d_esquites','d_mango','f_pozole','f_tacos','f_guac','f_mole','f_chich'],SOCT=['eat','hot','drink','ask','cheers'];
function soc(t){if(!G||!G.hands||G.phase=='end'||G.over!=null)return;if(NET&&NET.role=='g')act({k:'f',t});else socl(0,t)}
function snack(el){const k=el.dataset.k;if(!G||G.turn==0||G.res||G.over!=null)return;const dr=/^[cb]_/.test(k)||DRK.includes(k);if(!dr&&!DISH.includes(k))return;soc(dr?'drink':HOT.includes(k)?'hot':'eat')}
function socAsk(){soc('ask')}
/* lo resuelve quien manda (anfitrión o partida solo) y lo anuncia a todos */
function socl(p,t){if(!G||!G.hands||G.phase=='end'||G.over!=null||!SOCT.includes(t))return;const now=Date.now();
 if(t=='cheers'){const a=G.ask;if(!a||now-a.ts>8000||a.p==p||a.ok.includes(p))return;a.ok.push(p);announce('fx',a.p,'cl');announce('fx',p,'cl');return}
 G.sc=G.sc||[];if(G.sc[p]&&now-G.sc[p]<2200)return;G.sc[p]=now;
 if(t=='ask'){G.ask={p,ts:now,ok:[]};announce('fx',p,'ask');if(!NET)for(let j=1;j<G.n;j++)if(j!=p)setTimeout(()=>{if(G&&G.ask&&G.ask.ts==now&&Math.random()<.65)socl(j,'cheers')},1300+Math.random()*2400)}
 else if(t=='drink'){G.dr=G.dr||[];G.dr[p]=(G.dr[p]||0)+1;announce('fx',p,G.dr[p]%4==0?'hic':'drink')}
 else announce('fx',p,t)}
function aiSoc(me){if(!G||NET||PZ())return;const r=Math.random();if(r<.22)setTimeout(()=>socl(me,['eat','drink','drink','hot'][Math.random()*4|0]),900+Math.random()*1500);else if(r<.3)setTimeout(()=>socl(me,'ask'),1200)}
function inv(w){document.querySelectorAll('.inv').forEach(e=>e.remove());if(!G||G.res||G.over!=null)return;const d=document.createElement('div');d.className='inv';const s=document.createElement('span');s.textContent='🍻 '+nmG(w)+' te invita a brindar';const b=document.createElement('button');b.textContent='¡Chinchín!';b.onclick=()=>{d.remove();soc('cheers')};d.append(s,b);document.body.appendChild(d);setTimeout(()=>d.remove(),8000)}
/* ===== revancha: cada jugador elige seguir o irse (2 a 4 en sala) ===== */
function endBtns(g){if(!NET)return`<div class=row style="justify-content:center"><button class=btn onclick="start()">🔁 Revancha</button><button class="btn y" onclick="menu()">🏠 Menú</button></div>`;
 const rv=g.rv||[],me=rv[0]||0,yes=rv.filter(x=>x==1).length,pend=g.n-rv.filter(x=>x).length;
 const l=Array.from({length:g.n},(_,i)=>`<span class=rvp>${AVH(i?pinfo(i).a:(P.ph||P.av))} ${i?hx(pinfo(i).n):'Vos'} ${['⏳','✅','🚪'][rv[i]||0]}</span>`).join('');
 return`<div class=cap style="margin-top:8px">¿Seguimos jugando?</div><div class=rvl>${l}</div><div class=row style="justify-content:center">${me==1?`<span class=cap>✅ Esperando a los demás…</span>`:`<button class=btn onclick="rvPick(1)">🔁 Revancha</button>`}${me==1&&yes>=2&&pend>0&&NET.role=='h'?`<button class="btn y" onclick="rvPick(3)">▶ Empezar ya</button>`:''}<button class="btn y" onclick="rvPick(2)">🚪 ${NET.role=='h'?(NET.cs.filter((c,i)=>i&&c&&c.open).length>=2?'Salir (pasa la sala)':'Salir (cierra la sala)'):'Salir'}</button></div>`}
function rvPick(v){if(!NET||!G)return;if(v==3){rvGo(1);return}
 if(NET.role=='g'){act({k:'v',v});if(v==2)setTimeout(menu,300)}
 else if(v==2)hostLeave();else rvVote(0,1)}
function rvVote(p,v){if(!G||G.over==null||!NET||NET.role!='h'||(v!=1&&v!=2))return;G.rv=G.rv||Array(G.n).fill(0);G.rv[p]=v;R();if(G.rv.every(x=>x))rvGo(0)}
function rvGo(f){if(!G||G.over==null||!NET||NET.role!='h'||!G.rv||G.rv[0]!=1)return;
 const keep=[...Array(G.n).keys()].filter(i=>G.rv[i]==1);
 if(keep.length<2){bcast({t:'bye',m:'Nadie más quiso la revancha'});toast('Nadie más quiso la revancha');setTimeout(menu,500);return}
 NET.cs.forEach((c,i)=>{if(i&&c&&G.rv[i]!=1)send({t:'bye',m:'La revancha empezó sin vos'},c)});
 const op=NET.pl.slice(),oc=NET.cs.slice();NET.pl=keep.map(i=>op[i]);NET.cs=keep.map(i=>oc[i]||null);NET.cs.forEach((c,i)=>{if(c)c.seat=i});NET.n=keep.length;NET.ps={};
 G=null;ORD=[];roster();startNet()}
/* ===== el anfitrión se va y le pasa la sala a otro jugador ===== */
function hostLeave(){const live=[];NET.cs.forEach((c,i)=>{if(i&&c&&c.open&&NET.pl[i])live.push(i)});
 if(live.length<2){bcast({t:'bye',m:'El anfitrión cerró la sala'});setTimeout(menu,300);return}
 const nh=live.find(i=>G.rv&&G.rv[i]==1)||live[0],order=[nh,...live.filter(i=>i!=nh)];
 const pl=order.map(i=>({n:NET.pl[i].n,a:NET.pl[i].a,tok:NET.pl[i].tok})),sc=order.map(i=>G.scores[i]);
 let ov=order.indexOf(G.over);if(ov<0)ov=sc.indexOf(Math.min(...sc));
 const sn={n:order.length,d40:G.d40,lvl:1,lim:G.lim,scores:sc,round:G.round,over:ov,hands:order.map(()=>[]),deck:[],disc:[],turn:-1,phase:'end',hist:(G.hist||[]).map(r=>({d:order.map(i=>r.d[i]),w:order.indexOf(r.w),c:r.c,r:r.r})),ru:order.map(()=>1),rv:order.map(()=>0),evs:[],log:[],res:null,al:0};
 order.forEach((i,k)=>send(k==0?{t:'mig',h:1,code:NET.code,n:order.length,pl,G:sn}:{t:'mig',h:0,nm:pl[0].n},NET.cs[i]));
 setTimeout(menu,700)}
function migrate(m){if(!NET||NET.role!='g')return;
 if(!m.h){toast('👑 '+clean(m.nm,14)+' es ahora el anfitrión. Reconectando…');NET.rt=0;return}
 const n=Math.max(2,Math.min(4,+m.n||2)),s=m.G||{},ok=a=>typeof a=='string'&&a.length<13000?a:'🌮';
 const pl=(m.pl||[]).slice(0,n).map(p=>({n:clean(p.n)||'Jugador',a:ok(p.a),tok:clean(p.tok,12)}));if(pl.length<2)return;
 const old=NET,gs={n:pl.length,d40:s.d40,lvl:1,lim:+s.lim||100,scores:(s.scores||[]).map(x=>+x||0).slice(0,pl.length),round:+s.round||0,over:Math.max(0,+s.over||0),hands:pl.map(()=>[]),deck:[],disc:[],turn:-1,phase:'end',hist:Array.isArray(s.hist)?s.hist.slice(0,60):[],ru:pl.map(()=>1),rv:pl.map(()=>0),evs:[],log:[],res:null,al:0};
 NET={role:'h',code:old.code,rt:0,rs:gs,try:0,n:pl.length,pl,cs:[],ps:{}};NET.pl[0]={n:P.name||'Jugador',a:P.ph||P.av,tok:P.tok};
 try{old.peer.destroy()}catch(e){}toast('👑 ¡Ahora sos el anfitrión de la sala!');openHost()}
menu();if(!P.seen){P.seen=1;save();tuto()}
</script></body></html>
